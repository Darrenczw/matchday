<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matchday</title>
<meta name="description" content="Your NFL, football and NBA games in Singapore time, with where to watch.">
<meta name="theme-color" content="#e8e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchday">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://site.api.espn.com" crossorigin>
<link rel="preconnect" href="https://a.espncdn.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/SairaCondensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Saira-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<!-- Every app file at once: without these the browser finds them one import level at a time (4 waves). -->
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/rules.js">

<link rel="modulepreload" href="js/identity.js">

<link rel="modulepreload" href="js/espn.js">
<link rel="modulepreload" href="js/cal.js">
<link rel="modulepreload" href="js/tv.js">
<link rel="modulepreload" href="js/suggest.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/ground.js">
<link rel="modulepreload" href="js/swipe.js">
<link rel="modulepreload" href="js/clips.js">
<link rel="modulepreload" href="js/prefetch.js">
<link rel="modulepreload" href="js/views/home.js">
<link rel="modulepreload" href="js/views/follow.js">

<link rel="modulepreload" href="js/views/settings.js">
<link rel="preload" href="data/rights.json" as="fetch" crossorigin>
<script>
  // Apply the saved look before first paint, so there is no flash of the wrong theme.
  try {
    var ns = /[?&]demo\b/.test(location.search) ? 'md-demo:' : 'md:';
    var s = JSON.parse(localStorage.getItem(ns + 'settings') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
</head>
<body>
<div id="ground" aria-hidden="true"></div>
<main id="view" tabindex="-1"></main>
<div id="bar"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav class="tabs" aria-label="Main">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>My games</span></a>
  <a href="#/follow" data-tab="follow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg><span>Follow</span></a>
  <a href="#/week" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>This week</span></a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.2h3.4l.5 2.4c.6.2 1.2.5 1.7.9l2.3-.8 1.7 2.9-1.8 1.6a6.6 6.6 0 010 2l1.8 1.6-1.7 2.9-2.3-.8c-.5.4-1.1.7-1.7.9l-.5 2.4h-3.4l-.5-2.4c-.6-.2-1.2-.5-1.7-.9l-2.3.8-1.7-2.9 1.8-1.6a6.6 6.6 0 010-2L4.1 8.6l1.7-2.9 2.3.8c.5-.4 1.1-.7 1.7-.9z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></a>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
