<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matchday</title>
<meta name="description" content="Your NFL, football and NBA games in Singapore time, with where to watch.">
<meta name="theme-color" content="#e8e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchday">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/SairaCondensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Saira-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved look before first paint, so there is no flash of the wrong theme.
  try {
    var ns = /[?&]demo\b/.test(location.search) ? 'md-demo:' : 'md:';
    var s = JSON.parse(localStorage.getItem(ns + 'settings') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
</head>
<body>
<div id="ground" aria-hidden="true"></div>
<main id="view" tabindex="-1"></main>
<div id="bar"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav class="tabs" aria-label="Main">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>My games</span></a>
  <a href="#/follow" data-tab="follow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg><span>Follow</span></a>
  <a href="#/week" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>This week</span></a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></a>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
