<script>
  // Apply the saved look before first paint, so there is no flash of the wrong theme.
  try {
    var ns = /[?&]demo\b/.test(location.search) ? 'md-demo:' : 'md:';
    var s = JSON.parse(localStorage.getItem(ns + 'settings') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
