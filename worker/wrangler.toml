# Matchday calendar helper. Deploy: see TECH-DESIGN.md section 10. Run with Deno: deno run -A npm:wrangler@4 <command>
name = "matchday-cal"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/2 * * * *", "1-59/2 * * * *"]

[vars]
APP_ORIGIN = "https://darrenczw.github.io"

[[d1_databases]]
binding = "DB"
database_name = "matchday"
database_id = "6d6b4575-6904-4605-be9b-61e7612a9685"

# Practice copy: its own Worker and database, used by the app's ?demo mode and for tests.
[env.test]
name = "matchday-cal-test"
[env.test.triggers]
crons = ["*/2 * * * *", "1-59/2 * * * *"]
[env.test.vars]
APP_ORIGIN = "https://darrenczw.github.io"
CAL_NAME = "Matchday practice"
[[env.test.d1_databases]]
binding = "DB"
database_name = "matchday-test"
database_id = "910edf9c-6e8e-49af-b7b6-6546f23dd4b0"
